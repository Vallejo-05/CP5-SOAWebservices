spring.application.name=AutoEscola3ESR

server.port=8081

# Banco de dados (MySQL) - valores podem ser sobrescritos por variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoescola3esr?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fiap}

spring.jpa.open-in-view=false

# Segurança (JWT)
api.security.token.secret=${JWT_SECRET:12345678}

# CORS - origens permitidas (separadas por vírgula)
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,https://www.enderecodomeufront.com.br}

# API externa - ViaCEP
api.externa.viacep.url=${VIACEP_URL:https://viacep.com.br/ws}

# Documentação (Swagger / OpenAPI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
